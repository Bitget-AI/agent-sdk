  /api/v3/trade/countdown-cancel-all:
    post:
      tags:
      - Trade
      summary: CountDown Cancel All
      operationId: countdownCancelAll
      description: |-
        In practical use, clients need to periodically send heartbeat requests to prevent uncontrolled open orders due to
        abnormal disconnections or system crashes.<br/>
        For example, if your expected heartbeat interval is 10 seconds, meaning if no heartbeat request is sent for over 10
        seconds, all orders must be canceled:<br/>
        - Under normal circumstances, you can call this interface every 3-5 seconds, set the countdown to 10, and repeatedly
        call it to reset the countdown.<br/>
        - Under abnormal circumstances, if no heartbeat request is sent for over 10 seconds, all orders under the account will
        be automatically canceled; after automatic cancellation, the Deadman Switch mechanism will automatically close.<br/>
        - To manually close the Deadman Switch mechanism, simply set the countdown to 0.<br/>
        P.S. This interface only supports canceling orders under UTA accounts, not classic accounts.<br/>
        Please contact your dedicated Business Development representative to apply for access to this interface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CountdownCancelAllRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
