openapi: "3.0.3"
info:
  title: Bitget UTA API Collection
  description: Auto-generated Postman collection from UTA API documentation with automatic signature generation
  version: "3.0.0"
servers:
- url: "https://api.bitget.com"
  description: "Bitget production API (Postman {{baseUrl}})"
tags:
- name: Account
  description: Account endpoints
- name: Trade
  description: Trade endpoints
- name: Market
  description: Market endpoints
- name: Strategy
  description: Strategy endpoints
- name: Broker
  description: Broker endpoints
- name: Crypto Loans
  description: Crypto Loans endpoints
- name: Inst Loan
  description: Inst Loan endpoints
- name: Tax
  description: Tax endpoints
security:
- apiKeyAuth: []
  apiSignAuth: []
  apiTimestampAuth: []
  apiPassphraseAuth: []
paths:
  /api/v3/account/deposit-address:
    get:
      tags:
      - Account
      summary: Get Deposit Address
      operationId: getDepositAddress
      description: Get deposit address
      parameters:
      - name: coin
        in: query
        description: "Coin name - The currency name can be obtained using the Get Currency Information API."
        required: true
        schema:
          type: string
      - name: chain
        in: query
        description: "Chain Name - The chain name can be obtained using the Get Currency Information API. - If not filled, the system will automatically match a chain to generate a deposit address"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "Deposit Quantity - Only applies to BTC Lightning Network - Limit range: 0.000001 - 0.01."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/deposit-records:
    get:
      tags:
      - Account
      summary: Get Deposit Records
      operationId: getDepositRecords
      description: Get deposit records
      parameters:
      - name: coin
        in: query
        description: "Coin name - If left blank, all currency deposit records will be retrieved."
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        description: "Query record start time<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li></ul>"
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        description: "Query record end time<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li></ul>"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Items per page The default value is 20, and the maximum value is 100."
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID - Used for pagination to reduce query response time - Do not send for the initial query. When querying the second page and subsequent data, use the smallest orderId returned from the previous query. The results will return data less than that value"
        required: false
        schema:
          type: string
      - name: orderId
        in: query
        description: "Order ID - Used for specifying order queries."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-deposit-address:
    get:
      tags:
      - Account
      summary: Get Sub Deposit Address
      operationId: getSubDepositAddress
      description: Get sub deposit address
      parameters:
      - name: subUid
        in: query
        description: "Sub-account UID - The sub-account UID can be obtained via the Sub-account List API."
        required: true
        schema:
          type: string
      - name: coin
        in: query
        description: "Coin name - The currency name can be obtained using the Get Currency Information API."
        required: true
        schema:
          type: string
      - name: chain
        in: query
        description: "Chain Name - The chain name can be obtained using the Get Currency Information API."
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "Deposit Quantity - Only applies to BTC Lightning Network - Limit range: 0.000001 - 0.01."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-deposit-records:
    get:
      tags:
      - Account
      summary: Get Sub Deposit Records
      operationId: getSubDepositRecords
      description: Get sub-account deposit records
      parameters:
      - name: coin
        in: query
        required: false
        schema:
          type: string
      - name: subUid
        in: query
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        required: false
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-unified-assets:
    get:
      tags:
      - Account
      summary: Get SubAccount Unified Assets
      operationId: getSubaccountUnifiedAssets
      description: Get SubAccount Unified Assets
      parameters:
      - name: subUid
        in: query
        description: "Sub-account UID Leave blank to return all sub-account asset lists"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID For pagination. Omit in first request. Pass previous cursor in subsequent requests."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Sub-accounts per Page Default value is 10, maximum is 50."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/create-sub-api:
    post:
      tags:
      - Account
      summary: Create Sub-account API Key
      operationId: createSubAccountApiKey
      description: |-
        - This API is used to create an API Key for a sub-account under a unified account. It is applicable when the main
        account is in a mix or unified account mode. If the current main account is in the classic account mode, this API
        cannot be called.
        - Currently, only the creation of virtual sub-accounts is supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSubAccountApiKeyRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/delete-sub-api:
    post:
      tags:
      - Account
      summary: Delete Sub-account API Key
      operationId: deleteSubAccountApiKey
      description: |-
        This API is used for the main account to delete a sub-account's API Key. It is not applicable for the main account or
        sub-account to delete their own API Key.
        Please note that once the deletion is completed, the sub-account API Key will be immediately invalid. Before performing
        the deletion, ensure that this operation will not cause any loss.
        This API only supports deleting API Keys of sub-accounts under a unified account, and does not support deleting API Keys
        of sub-accounts under a classic account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteSubAccountApiKeyRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/sub-api-list:
    get:
      tags:
      - Account
      summary: Get Sub-account API Keys
      operationId: getSubAccountApiKeys
      description: Supports querying the full API Key list under a single sub-account.
      parameters:
      - name: subUid
        in: query
        description: "Sub-account UID"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Items per page The default value is 100, and the maximum value is 100."
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID Used for pagination. Do not pass it for the first query. For subsequent queries (second page and beyond), use the cursor returned from the previous query."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/update-sub-api:
    post:
      tags:
      - Account
      summary: Modify Sub-account API Key
      operationId: modifySubAccountApiKey
      description: This API is used to modify the unified account sub-account API Key permissions and withdrawal whitelist IP addresses. It only supports modifying the API Key of a unified account sub-account and does not support creating an API Key for a classic account sub-account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ModifySubAccountApiKeyRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/create-sub:
    post:
      tags:
      - Account
      summary: Create Sub-account
      operationId: createSubAccount
      description: "- This API is used for the main account to create a sub-account. It only supports creating unified account virtual sub-accounts and does not support creating regular sub-accounts."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSubAccountRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/sub-account/agent-create:
    post:
      tags:
      - Account
      summary: Create Agent Sub-account
      operationId: createAgentSubAccount
      description: |-
        - This API is used for the parent account to create an Agent sub-account (broker/agent business). It only supports creating unified-account virtual sub-accounts and can only be called by the parent account.
        - Rate limit: 1 request/second/UID.
        - Permission required: unified-account read-write.
        - `username`: required, lowercase letters only, max 20 characters.
        - `passphrase`: required, 8-32 characters, letters and digits.
        - `note`: optional remark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAgentSubAccountRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/freeze-sub:
    post:
      tags:
      - Account
      summary: Freeze/Unfreeze Sub-account
      operationId: freezeUnfreezeSubAccount
      description: Freeze/Unfreeze Sub-account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FreezeUnfreezeSubAccountRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/user/sub-list:
    get:
      tags:
      - Account
      summary: Get Sub-account List
      operationId: getSubAccountList
      description: Query Sub-account List
      parameters:
      - name: limit
        in: query
        description: "Items per page The default value is 100, and the maximum value is 100."
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID Used for pagination. Do not pass it for the first query. For subsequent queries (second page and beyond), use the cursor returned from the previous query."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/transferable-coins:
    get:
      tags:
      - Account
      summary: Get Transferable Coins
      operationId: getTransferableCoins
      description: "Query transferable coins **between Classic and UTA accounts**. <br/>_Classic accounts include Spot, Isolated Margin, Cross Margin, USDT Futures, USDC Futures, Coin-M Futures, and P2P accounts_"
      parameters:
      - name: fromType
        in: query
        description: "From (source) account type spot Spot account/Funding account p2p P2P account/OTC account coin_futures Coin-M futures account usdt_futures USDT futures account usdc_futures USDC futures account crossed_margin Cross margin account isolated_margin Isolated margin account uta Unified trading account"
        required: true
        schema:
          type: string
          enum:
          - "spot"
          - "p2p"
          - "coin_futures"
          - "usdt_futures"
          - "usdc_futures"
          - "crossed_margin"
          - "isolated_margin"
          - "uta"
      - name: toType
        in: query
        description: "To (target) account type spot Spot account/Funding account p2p P2P account/OTC account coin_futures Coin-M futures account usdt_futures USDT futures account usdc_futures USDC futures account crossed_margin Cross margin account isolated_margin Isolated margin account uta Unified trading account"
        required: true
        schema:
          type: string
          enum:
          - "spot"
          - "p2p"
          - "coin_futures"
          - "usdt_futures"
          - "usdc_futures"
          - "crossed_margin"
          - "isolated_margin"
          - "uta"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-master-transfer:
    post:
      tags:
      - Account
      summary: Sub-Main Account Transfer
      operationId: subMainAccountTransfer
      description: "Sub-account initiates transfer to master account，and the caller must be the sub-account account API Key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SubMainAccountTransferRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-transfer-record:
    get:
      tags:
      - Account
      summary: Get the transfer records of Main-Sub account
      operationId: getTheTransferRecordsOfMainSubAccount
      description: This API supports retrieving transfer records between main and sub accounts.
      parameters:
      - name: subUid
        in: query
        description: "Sub-account UID. If not provided, transfer records of the main account will be retrieved."
        required: false
        schema:
          type: string
      - name: role
        in: query
        description: "Transfer-out account type initiator Initiator of the transfer receiver Recipient of the transfer Default: initiator"
        required: false
        schema:
          type: string
          enum:
          - "initiator"
          - "receiver"
      - name: coin
        in: query
        description: "Coin name"
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        description: "Start time for querying transfer records<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li><li>The time interval between startTime and endTime should not exceed 90 days.</li></ul>"
        required: false
        schema:
          type: string
      - name: endTime
        in: query
        description: "End time for querying transfer records<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li><li>The time interval between startTime and endTime should not exceed 90 days.</li></ul>"
        required: false
        schema:
          type: string
      - name: clientOid
        in: query
        description: "clientOid,Cannot exceed 64 characters."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Items per page The default value is 100, and the maximum value is 100."
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID Used for pagination. Do not pass it for the first query. For subsequent queries (second page and beyond), use the cursor returned from the previous query."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/sub-transfer:
    post:
      tags:
      - Account
      summary: Main-Sub Account Transfer
      operationId: mainSubAccountTransfer
      description: |-
        Sub-account to Main Account Asset Transfer. The transfer types supported by this API include:
        <ul>
        <li>Main account to sub-account (only the main account API Key has permission)</li>
        <li>Sub-account to main account (only the main account API Key has permission)</li>
        <li>Sub-account to sub-account (only the main account API Key has permission, and the sending and receiving sub-accounts must belong to the same main account)</li>
        <li>Sub-account internal transfer (only the main account API Key has permission, and the sending and receiving sub-accounts must be the same sub-account)</li>
        </ul>
        The UID of the transferring and receiving accounts in the request parameters must be in a main-sub or sibling
        relationship, and the caller must be the main account API Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MainSubAccountTransferRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/transfer:
    post:
      tags:
      - Account
      summary: Transfer
      operationId: transfer
      description: Support for fund transfers in and out between unified accounts and classic accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/withdrawal-records:
    get:
      tags:
      - Account
      summary: Get Withdrawal Records
      operationId: getWithdrawalRecords
      description: Get withdrawal records.
      parameters:
      - name: coin
        in: query
        description: "Coin name - If not filled in, all coin deposit records will be retrieved."
        required: false
        schema:
          type: string
      - name: orderId
        in: query
        description: "order ID - Either clientOid or orderId must be provided. If both are present or do not match, orderId will take priority"
        required: false
        schema:
          type: string
      - name: clientOid
        in: query
        description: "Client Order ID - Either clientOid or orderId must be provided. If both are present or do not match, orderId will take priority"
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        description: "Query record start time<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li></ul>"
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        description: "Query record end time<ul><li>Unix millisecond timestamp, e.g., 1690196141868</li></ul>"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Items per page The default value is 20, and the maximum value is 100."
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID - Used for pagination to reduce query response time - Do not send for the initial query. When querying the second page and subsequent data, use the smallest orderId returned from the previous query. The results will return data less than that value"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/withdrawal:
    post:
      tags:
      - Account
      summary: Withdrawal
      operationId: withdrawal
      description: Includes on-chain withdrawals and internal transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WithdrawalRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/adjust-account-mode:
    post:
      tags:
      - Account
      summary: Adjust Account Mode
      operationId: adjustAccountMode
      description: |-
        This endpoint supports the following account-mode switching scenarios. It supports switching between Basic Mode and
        Advanced Mode under the Unified Account:
        1. The master account switches its own mode
        2. A sub-account switches its own mode
        3. The master account switches the mode for its sub-account(s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdjustAccountModeRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/set-leverage:
    post:
      tags:
      - Account
      summary: Set Leverage
      operationId: setLeverage
      description: |-
        This endpoint allows you to set leverage.
        - Isolated margin leverage adjustment is not currently supported via the API and is expected to go live in Q1 2026.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetLeverageRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/set-hold-mode:
    post:
      tags:
      - Account
      summary: Set Holding Mode
      operationId: setHoldingMode
      description: This endpoint allows you to set the position holding mode between one-way and hedge mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetHoldingModeRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/deposit-account:
    post:
      tags:
      - Account
      summary: Set Up Deposit Account
      operationId: setUpDepositAccount
      description: |-
        This configuration item remains valid for a long time. That is, once a user sets a default recharge account for a
        certain symbol, it will be retained permanently, and there is no need to reconfigure it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetUpDepositAccountRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/fee-rate:
    get:
      tags:
      - Account
      summary: Get Account Fee Rate
      operationId: getAccountFeeRate
      description: Get Account Fee Rate
      parameters:
      - name: symbol
        in: query
        description: "Symbol e.g.,BTCUSDT"
        required: true
        schema:
          type: string
      - name: category
        in: query
        description: "Product type SPOT Spot trading MARGIN Margin trading USDT-FUTURES USDT futures COIN-FUTURES Coin-M futures USDC-FUTURES USDC futures"
        required: true
        schema:
          type: string
          enum:
          - "SPOT"
          - "MARGIN"
          - "USDT-FUTURES"
          - "COIN-FUTURES"
          - "USDC-FUTURES"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/funding-assets:
    get:
      tags:
      - Account
      summary: Get Account Funding Assets
      operationId: getAccountFundingAssets
      description: Obtain fund account information and only return the coins with assets.
      parameters:
      - name: coin
        in: query
        description: "Coin name"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/settings:
    get:
      tags:
      - Account
      summary: Get Account Info
      operationId: getAccountInfo
      description: |-
        - Query account information, including the holding mode, margin mode, leverage multiple, and more.
        - Isolated margin mode is not currently available via the API, and is expected to go live in Q1 2026.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/assets:
    get:
      tags:
      - Account
      summary: Get Account Assets
      operationId: getAccountAssets
      description: "Query account information and assets, with only non-zero balances being returned."
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/account/convert-records:
    get:
      tags:
