    BatchOrderRequest:
      type: object
      required: ["category", "symbol", "qty", "side", "orderType"]
      properties:
        category:
          type: string
          enum:
          - "SPOT"
          - "MARGIN"
          - "USDT-FUTURES"
          - "COIN-FUTURES"
          - "USDC-FUTURES"
          description: "Product type SPOT Spot trading MARGIN Margin trading USDT-FUTURES USDT futures COIN-FUTURES Coin-M futures USDC-FUTURES USDC futures All orders must have the same category"
        symbol:
          type: string
          description: "Symbol name e.g.,BTCUSDT"
        qty:
          type: string
          description: "Order quantity Spot/Margin For market buy orders,the unit is quote coin For limit and market sell orders, the unit is base coin USDT/USDC-Futures The unit is base coin COIN-Futures The unit is quote coin"
        price:
          type: string
          description: "Order price This field is required when orderType is limit"
        side:
          type: string
          enum:
          - "buy"
          - "sell"
          description: "Order side buy/sell"
        orderType:
          type: string
          enum:
          - "limit"
          - "market"
          description: "Order type limit/market"
        timeInForce:
          type: string
          enum:
          - "ioc"
          - "fok"
          - "gtc"
          - "post_only"
          description: "Time in force ioc Immediate or cancel. It must be executed immediately, with any unfilled portion canceled. fok Fill or kill. It must be fully executed immediately, or it is canceled entirely. gtc Good 'til canceled. It remains active until it is either filled or manually canceled. post_only Post only. It will only be added to the order book as a maker This field is required when orderType is limit. If omitted, it defaults to gtc"
        posSide:
          type: string
          enum:
          - "long"
          - "short"
          description: "Position side long/short This field is required in hedge-mode position. Available only for futures"
        clientOid:
          type: string
          description: "Client order ID"
        stpMode:
          type: string
          enum:
          - "none"
          - "cancel_taker"
          - "cancel_maker"
          - "cancel_both"
          description: "STP Mode, default none none not setting STP cancel_taker cancel taker order cancel_maker cancel maker order cancel_both cancel both of taker and maker orders"
