      - name: coin
        in: query
        description: "Coin"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/tax/records:
    get:
      tags:
      - Tax
      summary: Get Unified Account Tax Records
      operationId: getUnifiedAccountTaxRecords
      description: "Data query range: 366 days"
      parameters:
      - name: bizType
        in: query
        description: "Product type SPOT Spot trading MARGIN Margin trading USDT-FUTURES USDT futures COIN-FUTURES Coin-M futures USDC-FUTURES USDC futures OTHER Other"
        required: true
        schema:
          type: string
          enum:
          - "SPOT"
          - "MARGIN"
          - "USDT-FUTURES"
          - "COIN-FUTURES"
          - "USDC-FUTURES"
          - "OTHER"
      - name: marginType
        in: query
        description: "Margin Type: isolated isolated margin crossed cross margin. This field is effective when category=MARGIN. If not specified, the default is crossed (cross margin)."
        required: false
        schema:
          type: string
          enum:
          - "isolated"
          - "crossed"
      - name: coin
        in: query
        description: "Coin name - If not specified, tax records for all coins will be returned."
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        description: "Start timestamp A Unix timestamp in milliseconds e.g.,1597026383085"
        required: true
        schema:
          type: string
      - name: endTime
        in: query
        description: "End timestamp A Unix timestamp in milliseconds e.g.,1597026383185 The time range between startTime and endTime must not exceed 7 days"
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: "Limit per page Default:500. Maximum:500"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "Cursor ID - Used for pagination. Do not include it for the first query. When querying the second page and subsequent data, use the id returned from the previous query. The interface will then return the data for the next page."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: ACCESS-KEY
      description: "Bitget API key. Maps to the {{apiKey}} Postman variable."
    apiSignAuth:
      type: apiKey
      in: header
      name: ACCESS-SIGN
      description: "HMAC SHA256 request signature, Base64 encoded (sign = HMAC(timestamp + method + requestPath + body)). Derived from {{apiSecret}}."
    apiTimestampAuth:
      type: apiKey
      in: header
      name: ACCESS-TIMESTAMP
      description: Request timestamp in milliseconds.
    apiPassphraseAuth:
      type: apiKey
      in: header
      name: ACCESS-PASSPHRASE
      description: "API passphrase. Maps to the {{passphrase}} Postman variable."
  schemas:
    BitgetResponse:
      type: object
      description: "Standard Bitget API response envelope. The shape of `data` is endpoint-specific and is not provided by the source collection (TODO: refine per endpoint)."
      properties:
        code:
          type: string
          description: "Response code, \"00000\" on success"
          example: "00000"
        msg:
          type: string
          description: Response message
          example: success
        requestTime:
          type: integer
          format: int64
          description: Server response timestamp in milliseconds
          example: 1690000000000
        data:
          description: Endpoint-specific payload
          nullable: true
    AdjustAccountModeRequest:
      type: object
      required: ["mode"]
      properties:
        mode:
          type: string
          enum:
          - "basic"
          - "advanced"
          description: "Account mode basic Basic mode advanced Advanced mode"
        targetUid:
          type: string
          description: "Target account UID. If not provided, it defaults to the currently operated account. If a sub-account UID is provided, it indicates the master account is operating on the sub-account."
      example:
        mode: ""
        targetUid: ""
    BatchCancelRequest:
      type: object
      required: ["category", "symbol"]
      properties:
        orderId:
          type: string
          description: "Order ID Either clientOid or orderId must be provided. If both are present or do not match, orderId will take priority"
        clientOid:
          type: string
          description: "Client order ID Either clientOid or orderId must be provided. If both are present or do not match, orderId will take priority"
        category:
          type: string
          enum:
          - "SPOT"
          - "MARGIN"
          - "USDT-FUTURES"
          - "COIN-FUTURES"
          - "USDC-FUTURES"
          description: "Product type SPOT Spot trading MARGIN Margin trading USDT-FUTURES USDT futures COIN-FUTURES Coin-M futures USDC-FUTURES USDC futures All orders must have the same category"
        symbol:
          type: string
          description: "Symbol name e.g.,BTCUSDT"
      example:
        orderId: ""
        clientOid: ""
        category: ""
        symbol: ""
    BatchModifyOrdersRequest:
      type: object
      properties:
        orderId:
          type: string
          description: "Order ID Either orderId or clientOid must be provided If both orderId and clientOid are provided simultaneously, orderId takes higher priority"
        clientOid:
          type: string
          description: "Client order ID Either orderId or clientOid must be provided If both orderId and clientOid are provided simultaneously, orderId takes higher priority"
        qty:
          type: string
          description: "Order quantity Base coin Either qty or price must be provided"
        price:
          type: string
          description: "Order price Either qty or price must be provided"
        autoCancel:
          type: string
          enum:
          - "yes"
          - "no"
          description: "Will the original order be canceled if the order modification fails yes: Cancel no: Not cancel（default）"
        symbol:
          type: string
