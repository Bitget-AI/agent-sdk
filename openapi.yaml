    post:
      tags:
      - Inst Loan
      summary: Bind/Unbind UID to Risk Unit
      operationId: bindUnbindUidToRiskUnit
      description: |-
        Binding:
        - The uid and riskUnitId belong to the same main account.
        - The uid is not bound to any other risk unit.
        Unbinding:
        - The API key used for the call must belong to the main account or the lending-exclusive sub-account UID within the risk
        unit.
        - The uid is within the risk unit and is not equal to riskUnitId.
        - The uid has a zero balance, or the riskUnitId has not_paid_off or in_progress loan orders.
        The account mode must be set to Advanced Mode; Basic Mode is not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BindUnbindUidToRiskUnitRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
