  /api/v3/trade/place-batch:
    post:
      tags:
      - Trade
      summary: Batch Order
      operationId: batchOrder
      description: |-
        This endpoint allows the order placement across spot, margin, or futures markets with customizable parameters, including
        price, quantity, and order type, etc.
        - **Upcoming Features** (currently not supported)
        - Isolated spot margin will be available soon.
        - Copy trading order placement will be available soon.
        - Take profit and stop loss will be available soon.
        - **Futures** <br/>
        For one-way mode, reduce-only orders are allowed to place. If a reduce only order already exists and the order
        quantity equals the position size, or if a new reduce only order exceeds the remaining position size, the previous
        reduction order will be automatically canceled and replaced. In this case, the returned orderId will be null. <br/>*
        *It is recommended to always provide a `clientOid`.（currently,`reduce-only` orders are not supported）**
        - **Margin** <br/>Margin orders will automatically trigger fund borrowing.
        - **Order Check**
        - **Futures**:`price` must meet the price multiplier and be a multiple of `priceMultiplier`, and conform to the
        `pricePrecision` decimal places. `qty` must be greater than or equal to `minOrderAmount` and be a multiple of
        `sizeMultiplier`.
        - **Spot**:`price` must meet the decimal place requirement. `qty` must be greater than or equal to `minOrderAmount`.
        - **Open Position Logic**
        - **Hedge-mode**<br/>
        Open long: `side=buy` & `posSide=long`<br/>
        Open Short:  `side=sell` & `posSide=short`<br/>
        Close long: `side=sell` & `posSide=long`<br/>
        Close short: `side=buy` & `posSide=short`<br/>
        - **One-way-mode**<br/>
        Open long: `side=buy`<br/>
        Open short: `side=sell`<br/>
        Close long: `side=sell` & `reduceOnly=yes`<br/>
        Close short: `side=buy` & `reduceOnly=yes`<br/>
        - **Order Limit**
        - **Futures**: 400 orders across all USDT, Coin-M, and USDC futures trading pairs.
        - **Spot**: 400 orders across all spot and margin trading pairs.
        - **ClientOid Constraints**<br/>
        Please ensure your clientOid matches the regular expression `^[\.A-Z\:/a-z0-9_-]{1,32}$`, consisting of 1 to 32
        characters, including periods (.), uppercase letters, colons (:), lowercase letters, numbers, underscores (_), and
        hyphens (-).
        - **Request Monitor**<br/>
        The API requests will be monitored. If the total number of orders for a single account (including master and
        sub-accounts) exceeds a set daily limit (UTC 00:00 - UTC 24:00), the platform reserves the right to issue reminders,
        warnings, and enforce necessary restrictions. By using the API, clients acknowledge and agree to comply with these
        terms.
        - **API Broker rebate identifier**:<br/>
        The following code block needs to be added to the HTTP Header of the request.
        > "X-CHANNEL-API-CODE":"your-channel-api-code"
        - **Error Sample**<br/>
        > { "code":"40762", "msg":"The order size is greater than the max open size", "requestTime":1627293504612 }<br/>
        >
        This error code may occur in the following scenarios.
        - Insufficient account balance.<br/>
        - The position tier for this symbol has reached its limit. For details on specific tiers, please
        refer <a href='https://www.bitget.com/futures/introduction/position-tier?code=BTCUSDT_UMCBL?business=USDT_MIX_CONTRACT_BL' rel='nofollow'>
        here</a> .<br/>
        Note: If the following errors occur when placing an order, please use `clientOid` to query the order details to confirm
        the final result of the operation.
        > { "code": "40010", "msg": "Request timed out", "requestTime": 1666268894074, "data": null }<br/>
        > { "code": "40725", "msg": "service return an error", "requestTime": 1666268894071, "data": null }<br/>
        > { "code": "45001", "msg": "Unknown error", "requestTime": 1666268894071, "data": null }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BatchOrderRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
  /api/v3/trade/place-order:
    post:
      tags:
      - Trade
      summary: Place Order
      operationId: placeOrder
      description: |-
        This endpoint allows the order placement across spot, margin, or futures markets with customizable parameters, including price, quantity, and order type, etc.
        - **Upcoming Features** (currently not supported)
        - Isolated spot margin will be available soon.
        - Copy trading order placement will be available soon.
        - **Futures** <br/>
        For one-way mode, reduce-only orders are allowed to place. If a reduce only order already exists and the order quantity equals the position size, or if a new reduce only order exceeds the remaining position size, the previous reduction order will be automatically canceled and replaced. In this case, the returned orderId will be null. <br/>**It is recommended to always provide a `clientOid`.**
        - **Margin** <br/>Margin orders will automatically trigger fund borrowing.
        - **Order Check**
        - **Futures**:`price` must meet the price multiplier and be a multiple of `priceMultiplier`, and conform to the `pricePrecision` decimal places. `qty` must be greater than or equal to `minOrderAmount` and be a multiple of `sizeMultiplier`.
        - **Spot**:`price` must meet the decimal place requirement. `qty` must be greater than or equal to `minOrderAmount`.
        - **Open Position Logic**
        - **Hedge-mode**<br/>
        Open long: `side=buy` & `posSide=long`<br/>
        Open Short:  `side=sell` & `posSide=short`<br/>
        Close long: `side=sell` & `posSide=long`<br/>
        Close short: `side=buy` & `posSide=short`<br/>
        - **One-way-mode**<br/>
        Open long: `side=buy`<br/>
        Open short: `side=sell`<br/>
        Close long: `side=sell` & `reduceOnly=yes`<br/>
        Close short: `side=buy` & `reduceOnly=yes`<br/>
        - **Order Limit**
        - **Futures**: 400 orders across all USDT, Coin-M, and USDC futures trading pairs.
        - **Spot**: 400 orders across all spot and margin trading pairs.
        - **ClientOid Constraints**<br/>
        Please ensure your clientOid matches the regular expression `^[\.A-Z\:/a-z0-9_-]{1,32}$`, consisting of 1 to 32 characters, including periods (.), uppercase letters, colons (:), lowercase letters, numbers, underscores (_), and hyphens (-).
        - **Request Monitor**<br/>
        The API requests will be monitored. If the total number of orders for a single account (including master and sub-accounts) exceeds a set daily limit (UTC 00:00 - UTC 24:00), the platform reserves the right to issue reminders, warnings, and enforce necessary restrictions. By using the API, clients acknowledge and agree to comply with these terms.
        - **API Broker rebate identifier**:<br/>
        The following code block needs to be added to the HTTP Header of the request.
        > "X-CHANNEL-API-CODE":"your-channel-api-code"
        - **Error Sample**<br/>
        > { "code":"40762", "msg":"The order size is greater than the max open size", "requestTime":1627293504612 }<br/>
        >
        This error code may occur in the following scenarios.
        - Insufficient account balance.<br/>
        - The position tier for this symbol has reached its limit. For details on specific tiers, please refer <a href='https://www.bitget.com/futures/introduction/position-tier?code=BTCUSDT_UMCBL?business=USDT_MIX_CONTRACT_BL' rel='nofollow'>here</a> .<br/>
        - **COIN-M Futures Symbol Format Description:**<br/>
        - **<u>The symbol format for the new COIN-M business line is "XXXUSD_CM". For example, the BTCUSD trading pair in COIN-M futures is formatted as BTCUSD_CM.</u>**
        - The new COIN-M business line does not support modifying orders, ADL, strategy orders, or preset take-profit/stop-loss orders.
        Note: If the following errors occur when placing an order, please use `clientOid` to query the order details to confirm the final result of the operation.
        > { "code": "40010", "msg": "Request timed out", "requestTime": 1666268894074, "data": null }<br/>
        > { "code": "40725", "msg": "service return an error", "requestTime": 1666268894071, "data": null }<br/>
        > { "code": "45001", "msg": "Unknown error", "requestTime": 1666268894071, "data": null }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlaceOrderRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BitgetResponse"
